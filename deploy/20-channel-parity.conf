# Self-heal channel/plugin parity after every gateway start.
#
# Catches the "upgrade unbundled a channel plugin" failure mode (Discord,
# 2026-06-11): config says a channel is enabled, gateway boots healthy, but no
# plugin provides the channel and it is silently ignored.
#
# Leading '-' + backgrounded: never block or fail gateway startup.
#
# Install:
#   cp deploy/20-channel-parity.conf ~/.config/systemd/user/openclaw-gateway.service.d/
#   systemctl --user daemon-reload
[Service]
ExecStartPost=-/bin/bash -c '%h/session-warden/contrib/openclaw-patches/channel-parity.sh heal >> %h/.openclaw/logs/channel-parity.log 2>&1 &'
