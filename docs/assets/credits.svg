<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Most work is busywork. Spend cheap credits there. Keep frontier for the small slice that is actually hard.">
  <rect width="760" height="280" fill="#F7F1E8"/>
  <text x="380" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#0B3D3A">where the money should go</text>
  <text x="380" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7A7468">typical mix on a busy agent machine  not a live meter</text>

  <rect x="80" y="80" width="96" height="140" rx="10" fill="#7A9E7E"/>
  <text x="128" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#FFFFFF">80%</text>
  <text x="128" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#3D5A40">busywork</text>
  <text x="128" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7A7468">cheap CLI</text>

  <rect x="220" y="148" width="96" height="72" rx="10" fill="#C45C26"/>
  <text x="268" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#FFFFFF">15%</text>
  <text x="268" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">build</text>
  <text x="268" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7A7468">mid-tier</text>

  <rect x="360" y="188" width="96" height="32" rx="10" fill="#E07A5F"/>
  <text x="408" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#FFFFFF">5%</text>
  <text x="408" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#E07A5F">hard</text>
  <text x="408" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7A7468">frontier</text>

  <rect x="500" y="88" width="232" height="148" rx="16" fill="#FFFFFF" stroke="#0B3D3A" stroke-width="2"/>
  <text x="616" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#0B3D3A">the rule</text>
  <text x="616" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5C5346">pay pennies for lists</text>
  <text x="616" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5C5346">and status checks</text>
  <text x="616" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#E07A5F">keep Claude for hard</text>
</svg>
