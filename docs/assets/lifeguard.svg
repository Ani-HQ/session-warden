<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Optional OpenClaw lifeguard: detect a bloated Claude session, rotate it, summarize into memory, restart.">
  <rect width="760" height="200" fill="#F7F1E8"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#0B3D3A">optional · keep a long Claude session alive</text>

  <rect x="20" y="52" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#0B3D3A" stroke-width="2.2"/>
  <text x="100" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#0B3D3A">detect</text>
  <text x="100" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7A7468">bloat · fail · zombie</text>

  <path d="M184 102 L204 102" stroke="#C4B8A4" stroke-width="2.4"/>
  <polygon points="204,96 218,102 204,108" fill="#C4B8A4"/>

  <rect x="226" y="52" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#0B3D3A" stroke-width="2.2"/>
  <text x="306" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#0B3D3A">rotate</text>
  <text x="306" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7A7468">archive, never delete</text>

  <path d="M390 102 L410 102" stroke="#C4B8A4" stroke-width="2.4"/>
  <polygon points="410,96 424,102 410,108" fill="#C4B8A4"/>

  <rect x="432" y="52" width="160" height="100" rx="16" fill="#FFFFFF" stroke="#0B3D3A" stroke-width="2.2"/>
  <text x="512" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#0B3D3A">remember</text>
  <text x="512" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7A7468">write MEMORY.md</text>

  <path d="M596 102 L616 102" stroke="#C4B8A4" stroke-width="2.4"/>
  <polygon points="616,96 630,102 616,108" fill="#C4B8A4"/>

  <rect x="638" y="52" width="104" height="100" rx="16" fill="#0B3D3A"/>
  <text x="690" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F7F1E8">restart</text>
  <text x="690" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#E8C547">still knows</text>

  <text x="380" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7A7468">Claude Code sessions only · needs OpenClaw · bash install.sh</text>
</svg>
